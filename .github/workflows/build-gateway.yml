name: Build Green Gateway

# Builds the Green Gateway APK from the private green-mobile repo whenever its
# main branch moves, and publishes it as the newest release of this repo. The
# asset name never changes, so this link always serves the newest build:
#
#   https://github.com/AbidHasanPiash/green-releases/releases/latest/download/Green-Gateway.apk
#
# The build runs here (public repo: free Actions minutes), reading the app's
# source with a read-only deploy key, and runs green-mobile's
# scripts/release-gateway.sh — the same script used for releases from a Mac,
# which refuses to publish an APK not signed with the release key
# (green-mobile/release-cert.sha256). Secrets:
#   MOBILE_DEPLOY_KEY          private half of a read-only deploy key on green-mobile
#   GOOGLE_SERVICES_JSON       base64 of green-mobile/google-services.json (Firebase)
#   ANDROID_KEYSTORE_B64       base64 of the release keystore
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#
# Triggers are schedule + manual only — never pull_request — so nothing from
# a fork can run with these secrets.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even if green-mobile main has not changed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-gateway
  cancel-in-progress: false

env:
  SOURCE_REPO: git@github.com:AbidHasanPiash/green-mobile.git
  ASSET: Green-Gateway.apk

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      build: ${{ steps.head.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Has green-mobile main moved since the last release?
        id: head
        env:
          DEPLOY_KEY: ${{ secrets.MOBILE_DEPLOY_KEY }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::warning::MOBILE_DEPLOY_KEY is not set yet — nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          sha=$(git ls-remote "$SOURCE_REPO" refs/heads/main | cut -f1)
          last=$(jq -r '.commit // ""' latest.json 2>/dev/null || true)
          echo "green-mobile main: $sha · last released: ${last:-none}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ -n "$sha" ] && { [ "$sha" != "$last" ] || [ "$FORCE" = "true" ]; }; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: releases

      - name: Check out green-mobile
        env:
          DEPLOY_KEY: ${{ secrets.MOBILE_DEPLOY_KEY }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone -q "$SOURCE_REPO" app
          git -C app checkout -q "$SHA"
          rm -f ~/.ssh/id_ed25519

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('app/bun.lock') }}
          restore-keys: gradle-

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      - name: Release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build, verify and publish
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES_REPO: ${{ github.repository }}
          RELEASES_DIR: ${{ github.workspace }}/releases
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GRADLE_WORKERS: "4"
        run: |
          git -C "$RELEASES_DIR" config user.name "github-actions[bot]"
          git -C "$RELEASES_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/release-gateway.sh

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
