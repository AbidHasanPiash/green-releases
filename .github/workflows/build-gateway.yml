name: Build Green Gateway

# Builds the Green Gateway APK from the private green-mobile repo whenever its
# main branch moves, and publishes it as the newest release of this repo. The
# asset name never changes, so this link always serves the newest build:
#
#   https://github.com/AbidHasanPiash/green-releases/releases/latest/download/Green-Gateway.apk
#
# The build runs here (public repo: free Actions minutes), reading the app's
# source with a read-only deploy key. Secrets:
#   MOBILE_DEPLOY_KEY     private half of a read-only deploy key on green-mobile
#   GOOGLE_SERVICES_JSON  base64 of green-mobile/google-services.json (Firebase)
#
# Triggers are schedule + manual only — never pull_request — so nothing from
# a fork can run with these secrets.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even if green-mobile main has not changed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-gateway
  cancel-in-progress: false

env:
  SOURCE_REPO: git@github.com:AbidHasanPiash/green-mobile.git
  ASSET: Green-Gateway.apk
  # Every published APK must carry this signing certificate — phones refuse
  # an update signed with a different one.
  EXPECTED_CERT_SHA256: fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      build: ${{ steps.head.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Has green-mobile main moved since the last release?
        id: head
        env:
          DEPLOY_KEY: ${{ secrets.MOBILE_DEPLOY_KEY }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::warning::MOBILE_DEPLOY_KEY is not set yet — nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          sha=$(git ls-remote "$SOURCE_REPO" refs/heads/main | cut -f1)
          last=$(jq -r '.commit // ""' latest.json 2>/dev/null || true)
          echo "green-mobile main: $sha · last released: ${last:-none}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ -n "$sha" ] && { [ "$sha" != "$last" ] || [ "$FORCE" = "true" ]; }; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: releases

      - name: Check out green-mobile
        env:
          DEPLOY_KEY: ${{ secrets.MOBILE_DEPLOY_KEY }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone -q "$SOURCE_REPO" app
          git -C app checkout -q "$SHA"
          rm -f ~/.ssh/id_ed25519

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('app/bun.lock') }}
          restore-keys: gradle-

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      - name: Build APK
        working-directory: app
        env:
          GRADLE_WORKERS: "4"
        run: bash scripts/build-apk.sh green gateway

      - name: Verify and describe the APK
        id: apk
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          apk=$(ls app/dist/Green-Gateway-*.apk)
          cp "$apk" "$ASSET"

          cert=$("$BT/apksigner" verify --print-certs "$ASSET" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          if [ "$cert" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK is signed with $cert, expected $EXPECTED_CERT_SHA256 — phones would refuse the update."
            exit 1
          fi

          badging=$("$BT/aapt2" dump badging "$ASSET")
          version=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$badging" | head -1)
          code=$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<<"$badging" | head -1)
          sdk=$(sed -n "s/^sdkVersion:'\([0-9]*\)'.*/\1/p" <<<"$badging")
          declare -A ANDROID=([21]=5.0 [22]=5.1 [23]=6.0 [24]=7.0 [25]=7.1 [26]=8.0 [27]=8.1 [28]=9 [29]=10 [30]=11 [31]=12 [32]=12.1 [33]=13 [34]=14 [35]=15 [36]=16)
          sha256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          size=$(stat -c %s "$ASSET")

          {
            echo "version=$version"
            echo "code=$code"
            echo "tag=v$version-b$code"
          } >> "$GITHUB_OUTPUT"

          jq -n \
            --arg version "$version" --argjson versionCode "$code" \
            --arg commit "${{ needs.check.outputs.sha }}" \
            --arg sha256 "$sha256" --argjson sizeBytes "$size" \
            --arg sizeMb "$(awk "BEGIN{printf \"%.2f\", $size/1048576}")" \
            --arg minAndroid "${ANDROID[$sdk]:-$sdk}" \
            --arg downloadUrl "https://github.com/${{ github.repository }}/releases/latest/download/$ASSET" \
            --arg releasedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version:$version, versionCode:$versionCode, commit:$commit, sha256:$sha256, sizeBytes:$sizeBytes, sizeMb:$sizeMb, minAndroid:$minAndroid, downloadUrl:$downloadUrl, releasedAt:$releasedAt}' \
            > releases/latest.json
          cat releases/latest.json

      - name: Release notes
        run: |
          last=$(git -C releases show HEAD:latest.json 2>/dev/null | jq -r '.commit // ""' || true)
          {
            echo "**SHA-256:** \`$(jq -r .sha256 releases/latest.json)\`"
            echo "**Size:** $(jq -r .sizeMb releases/latest.json) MB · **Android** $(jq -r .minAndroid releases/latest.json)+"
            echo
            echo "### Changes"
            if [ -n "$last" ] && git -C app cat-file -e "$last" 2>/dev/null; then
              git -C app log --no-merges --pretty='- %s' "$last..HEAD"
            else
              git -C app log --no-merges --pretty='- %s' -10
            fi
          } > notes.md
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.apk.outputs.tag }}
          VERSION: ${{ steps.apk.outputs.version }}
          CODE: ${{ steps.apk.outputs.code }}
        run: |
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" releases/latest.json --clobber -R "${{ github.repository }}"
          else
            gh release create "$TAG" "$ASSET" releases/latest.json -R "${{ github.repository }}" \
              --title "Green Gateway $VERSION (build $CODE)" --notes-file notes.md --latest
          fi

      - name: Record the released commit
        working-directory: releases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -q -m "release: Green Gateway ${{ steps.apk.outputs.version }} (build ${{ steps.apk.outputs.code }})"
          git push -q
